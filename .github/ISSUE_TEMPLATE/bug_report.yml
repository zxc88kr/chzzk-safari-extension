name: 버그 제보
description: 기능이 안 되거나 화면이 깨질 때
labels: [bug]
assignees: [zxc88kr]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
      description: 어느 기능이, 어느 화면에서, 어떻게 안 되는지 적어주세요.
      placeholder: |
        라이브에 들어가도 자동 넓은 화면이 안 됩니다.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 버전
      description: 확장 버전은 팝업 오른쪽 위에 있습니다.
      placeholder: 확장 1.40.0 / macOS 15.2 / Safari 18.2
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷·콘솔 오류 (선택)
      description: |
        치지직 페이지에서 `⌥⌘C` 로 콘솔을 열어 빨간 오류가 있으면 함께 붙여주세요.
