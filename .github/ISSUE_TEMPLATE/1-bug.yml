name: 버그 제보
description: 안 되는 기능, 깨진 화면
title: "[버그] "
labels: [버그]
assignees: [zxc88kr]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
      description: 어느 기능이, 어느 화면에서, 어떻게 안 되는지 적어주세요.
      placeholder: |
        라이브에 들어가도 자동 넓은 화면이 안 됨
    validations:
      required: true

  - type: input
    id: ext-version
    attributes:
      label: 확장 버전
      description: 팝업 오른쪽 위에서 확인하세요.
      placeholder: 1.40.0
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: macOS · Safari 버전 (선택)
      description: 애플 메뉴 → 이 Mac에 관하여 에서 확인하세요.
      placeholder: macOS 15.2 / Safari 18.2

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷·콘솔 오류 (선택)
      description: |
        문제 화면을 캡처해 붙여주시면 좋습니다.
        치지직 페이지에서 `⌥⌘C` 로 콘솔을 열어 빨간 오류가 보이면 그 내용도 함께 붙여주세요.
      placeholder: 이미지를 여기로 끌어다 놓거나 콘솔 오류를 붙여넣으세요
