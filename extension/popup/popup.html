<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <span class="mark">CHZZK</span>
    <span class="mark-sub">Extension</span>
    <span class="ver" id="version"></span>
  </header>

  <button class="update" id="update" type="button" hidden>
    <span class="update-text">새 버전 <span id="update-version"></span> · 업데이트하려면 누르세요</span>
  </button>

  <section>
    <div class="sec-head">
      <h2>플레이어</h2>
    </div>
    <label class="row">
      <div class="text">
        <span class="label">지연시간 표시</span>
        <span class="desc">클릭: 1.5배속 따라잡기 · ⇧클릭: 라이브 지점으로 이동</span>
      </div>
      <input type="checkbox" data-key="latencyDisplay" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">방향키 탐색</span>
        <span class="desc">←/→ 키로 라이브 재생 위치 이동</span>
      </div>
      <input type="checkbox" data-key="arrowSeek" class="switch" />
    </label>
    <label class="row range-row" data-parent="arrowSeek">
      <div class="text">
        <span class="label">이동 간격 <output data-out="seekStep"></output></span>
      </div>
      <input type="range" data-key="seekStep" data-unit="초" min="1" max="30" step="1" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">자동 넓은 화면</span>
        <span class="desc">방송 입장 시 넓은 화면 전환</span>
      </div>
      <input type="checkbox" data-key="autoWide" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">음소거 자동 해제</span>
        <span class="desc">방송 입장 시 음소거 해제 (Safari 자동 재생 허용 필요)</span>
      </div>
      <input type="checkbox" data-key="autoUnmute" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">통나무 자동 획득</span>
        <span class="desc">시청 중 쌓인 통나무 자동 획득</span>
      </div>
      <input type="checkbox" data-key="autoLumber" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">화면 캡처 버튼</span>
        <span class="desc">현재 장면을 이미지로 저장</span>
      </div>
      <input type="checkbox" data-key="captureButton" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">PIP 버튼</span>
        <span class="desc">영상을 작은 창(PIP)으로 띄워 시청</span>
      </div>
      <input type="checkbox" data-key="pipButton" class="switch" />
    </label>
  </section>

  <section>
    <div class="sec-head">
      <h2>채팅</h2>
    </div>
    <label class="row">
      <div class="text">
        <span class="label">타임스탬프</span>
        <span class="desc">새 채팅에 수신 시각 표시</span>
      </div>
      <input type="checkbox" data-key="chatTimestamp" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">자주 쓰는 문구</span>
        <span class="desc">저장한 문구를 채팅창에 바로 입력</span>
      </div>
      <input type="checkbox" data-key="chatMacros" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">랭킹 숨기기</span>
        <span class="desc">후원·통나무 랭킹 모두 숨김</span>
      </div>
      <input type="checkbox" data-key="hideRanking" class="switch" />
    </label>
  </section>

  <section>
    <div class="sec-head">
      <h2>탐색</h2>
    </div>
    <label class="row">
      <div class="text">
        <span class="label">방송 미리보기</span>
        <span class="desc">마우스를 올려 미리보기 · 우클릭 음소거 토글</span>
      </div>
      <input type="checkbox" data-key="hoverPreview" class="switch" />
    </label>
    <label class="row range-row" data-parent="hoverPreview">
      <div class="text">
        <span class="label">미리보기 크기 <output data-out="previewWidth"></output></span>
      </div>
      <input type="range" data-key="previewWidth" data-unit="px" min="300" max="1000" step="50" />
    </label>
    <label class="row range-row" data-parent="hoverPreview">
      <div class="text">
        <span class="label">미리보기 지연 <output data-out="previewDelay"></output></span>
      </div>
      <input type="range" data-key="previewDelay" data-unit="초" min="0.1" max="3" step="0.1" />
    </label>
    <label class="row range-row" data-parent="hoverPreview">
      <div class="text">
        <span class="label">미리보기 볼륨 <output data-out="previewVolume"></output></span>
      </div>
      <input type="range" data-key="previewVolume" data-unit="%" min="0" max="100" step="5" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">사이드바 자동 갱신</span>
        <span class="desc">팔로잉 목록 30초마다 갱신</span>
      </div>
      <input type="checkbox" data-key="sidebarRefresh" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">방송 시작 자동 입장</span>
        <span class="desc">기다리던 방송이 시작되면 바로 입장</span>
      </div>
      <input type="checkbox" data-key="autoReload" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">채널 채팅 탭</span>
        <span class="desc">오프라인 채널에 채팅 탭 추가</span>
      </div>
      <input type="checkbox" data-key="channelChatTab" class="switch" />
    </label>
  </section>

  <section>
    <div class="sec-head">
      <h2>화면 정리</h2>
    </div>
    <label class="row">
      <div class="text">
        <span class="label">정적 로고</span>
        <span class="desc">좌상단 로고 애니메이션 제거</span>
      </div>
      <input type="checkbox" data-key="staticLogo" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">오프라인 채널 숨기기</span>
        <span class="desc">사이드바의 오프라인 채널 숨김</span>
      </div>
      <input type="checkbox" data-key="hideOffline" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">차단 방송 숨기기</span>
        <span class="desc">차단 채널의 방송 카드 숨김</span>
      </div>
      <input type="checkbox" data-key="hideBlocked" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">치즈팜 광고 숨기기</span>
      </div>
      <input type="checkbox" data-key="hidePromo" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">인기 카테고리 숨기기</span>
      </div>
      <input type="checkbox" data-key="hideSidebarCategory" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">방송 일정 숨기기</span>
      </div>
      <input type="checkbox" data-key="hideSidebarSchedule" class="switch" />
    </label>
    <label class="row">
      <div class="text">
        <span class="label">추천·파트너 숨기기</span>
      </div>
      <input type="checkbox" data-key="hideRecommended" class="switch" />
    </label>
  </section>

  <footer class="foot">
    <a href="https://github.com/zxc88kr/chzzk-safari-extension" target="_blank" rel="noopener">GitHub</a>
    <span class="dot">·</span>
    <a href="https://github.com/zxc88kr/chzzk-safari-extension/issues/new/choose" target="_blank" rel="noopener">의견 보내기</a>
  </footer>

  <script src="../common/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
